name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit (tag in the comment) so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The wrapper is stored without the executable bit.
      - run: chmod +x ./gradlew

      - name: Test, build and lint
        run: ./gradlew :obd-core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          retention-days: 14
          path: |
            app/build/reports/
            app/build/test-results/
            obd-core/build/reports/
            obd-core/build/test-results/
