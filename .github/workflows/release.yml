name: Release

# Runs on a version tag (git tag v1.0.0 && git push origin v1.0.0). See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to a commit (tag in the comment) so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # Read-only: a release build must not write into the cache that CI builds read from.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - run: chmod +x ./gradlew

      - name: Check the signing secrets exist
        env:
          KLD_KEYSTORE_BASE64: ${{ secrets.KLD_KEYSTORE_BASE64 }}
          KLD_KEYSTORE_PASSWORD: ${{ secrets.KLD_KEYSTORE_PASSWORD }}
          KLD_KEY_ALIAS: ${{ secrets.KLD_KEY_ALIAS }}
          KLD_KEY_PASSWORD: ${{ secrets.KLD_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KLD_KEYSTORE_BASE64 KLD_KEYSTORE_PASSWORD KLD_KEY_ALIAS KLD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Nothing was published: a release must be signed with the real key. See docs/RELEASING.md."
            exit 1
          fi

      - name: Check the tag matches the app version
        run: |
          version="$(./gradlew -q :app:printVersionName)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts. Bump the version, commit, and tag again."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the keystore
        env:
          KLD_KEYSTORE_BASE64: ${{ secrets.KLD_KEYSTORE_BASE64 }}
        run: |
          echo "$KLD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KLD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed release
        env:
          KLD_KEYSTORE_PASSWORD: ${{ secrets.KLD_KEYSTORE_PASSWORD }}
          KLD_KEY_ALIAS: ${{ secrets.KLD_KEY_ALIAS }}
          KLD_KEY_PASSWORD: ${{ secrets.KLD_KEY_PASSWORD }}
          # Makes the build fail instead of falling back to the debug key.
          KLD_REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew :obd-core:test :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Verify the signature and collect the files
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "$apk" | tee signature.txt
          if grep -qi "CN=Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key. Nothing was published."
            exit 1
          fi
          mkdir dist
          cp "$apk" "dist/kline-dash-$VERSION.apk"
          # The R8 mapping decodes the obfuscated stack traces of crash reports from this exact release.
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "dist/kline-dash-$VERSION-mapping.txt.gz"
          (cd dist && sha256sum "kline-dash-$VERSION.apk" "kline-dash-$VERSION-mapping.txt.gz" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "K-Line Dash $VERSION" \
            --generate-notes \
            --verify-tag
